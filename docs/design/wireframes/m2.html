<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2 メンバーのプロフィール</title>
<link rel="stylesheet" href="wireframes.css">
</head>
<body>
<div class="sheet">
  <header class="sheet-header">
    <p><a href="index.html">‹ 画面の一覧 / All screens</a></p>
    <h1>M2 メンバーのプロフィール（幹事） / Member profile</h1>
    <p>名前、平均タイム、ラップ数、大会ごとのラップタイム。見るだけ。参考：Strava の「Pace Analysis」（平均と、区切りごとのタイムを並べる）。</p>
  </header>
  <div class="frames">

    <figure class="frame-wrap">
      <figcaption>M2 メンバーのプロフィール</figcaption>
      <div class="frame">
        <nav class="topbar"><a class="back" href="m1.html">‹ 名簿</a></nav>
        <main class="content">
          <h1 class="title1">佐藤 健</h1>
          <ul class="cards" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
            <li class="card card-stack"><span class="subheadline">平均タイム（1km）</span><span class="title2 numbers">3:58</span></li>
            <li class="card card-stack"><span class="subheadline">ラップ数</span><span class="title2 numbers">31</span></li>
          </ul>
          <section class="group">
            <h2 class="group-heading">大会ごとのラップタイム</h2>
            <ul class="cards">
              <li class="card card-stack">
                <div class="card-row"><span class="card-main"><span class="headline">冬季ロードリレー</span><span class="subheadline">2026年12月20日（日）・1区・4区</span></span></div>
                <table class="times">
                  <thead><tr><th>km</th><th class="right">ラップ</th></tr></thead>
                  <tbody>
                    <tr><td>1</td><td class="right">3:55</td></tr>
                    <tr><td>2</td><td class="right">3:58</td></tr>
                    <tr><td>3</td><td class="right">4:01</td></tr>
                  </tbody>
                </table>
              </li>
              <li class="card card-stack">
                <div class="card-row"><span class="card-main"><span class="headline">秋の記録会</span><span class="subheadline">2026年10月18日（日）・2区</span></span></div>
                <table class="times">
                  <thead><tr><th>km</th><th class="right">ラップ</th></tr></thead>
                  <tbody>
                    <tr><td>1</td><td class="right">3:52</td></tr>
                    <tr><td>2</td><td class="right">3:57</td></tr>
                  </tbody>
                </table>
              </li>
            </ul>
          </section>
        </main>
        <nav class="tabbar" aria-label="メイン">
          <a class="tab" href="r1.html"><span class="tab-icon"></span>大会</a>
          <a class="tab tab-current" href="m1.html"><span class="tab-icon"></span>名簿</a>
          <a class="tab" href="m3.html"><span class="tab-icon"></span>承認<span class="badge">2</span></a>
          <a class="tab" href="p1.html"><span class="tab-icon"></span>自分</a>
        </nav>
      </div>
      <div class="annotation"><p>ボタンはない。ラップのない大会は出さない。</p></div>
    </figure>

  </div>
</div>
</body>
</html>
