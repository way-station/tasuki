<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R2 大会の詳細</title>
<link rel="stylesheet" href="wireframes.css">
</head>
<body>
<div class="sheet">
  <header class="sheet-header">
    <p><a href="index.html">‹ 画面の一覧 / All screens</a></p>
    <h1>R2 大会の詳細 / Race detail</h1>
    <p>幹事と、誘われていて回答が「不参加」ではないメンバーが開ける。出すものは、幹事、メンバー（未回答・保留）、メンバー（参加）で違う。参考：Spond の予定への回答と調整さんの ○△×（出欠）、TeamSnap の公開したラインナップ（確定した走順）、Strava のラップとスプリット（走者のラップタイム）。</p>
  </header>
  <div class="frames">

    <figure class="frame-wrap" id="organizer">
      <figcaption>R2 幹事</figcaption>
      <div class="frame">
        <nav class="topbar"><a class="back" href="r1.html">‹ 大会</a></nav>
        <main class="content">
          <header class="group">
            <h1 class="title1">冬季ロードリレー</h1>
            <p><span class="label label-confirmed">走順確定</span></p>
          </header>
          <section class="panel">
            <dl class="facts">
              <dt>種別</dt><dd>距離制・4 区</dd>
              <dt>開催日</dt><dd>2026年12月20日（日）</dd>
              <dt>区の距離</dt><dd class="numbers">5 km・3.2 km・3.2 km・5 km</dd>
              <dt>目標タイム</dt><dd class="numbers">1:08:00</dd>
              <dt>締め切り</dt><dd>2026年12月6日（日）23:59</dd>
            </dl>
            <p class="body">7:00 に正門前に集合。ゼッケンは当日配ります。</p>
          </section>
          <section class="group">
            <h2 class="group-heading">大会の管理</h2>
            <ul class="cards">
              <li><a class="card" href="r3.html"><span class="card-main"><span class="headline">大会を編集</span></span><span class="chevron">›</span></a></li>
              <li><a class="card" href="r4.html"><span class="card-main"><span class="headline">招待</span><span class="subheadline">7 人を招待</span></span><span class="chevron">›</span></a></li>
              <li><a class="card" href="r5.html"><span class="card-main"><span class="headline">出欠</span><span class="subheadline">参加 4・保留 1・未回答 1・不参加 1</span></span><span class="chevron">›</span></a></li>
              <li><a class="card" href="r6.html"><span class="card-main"><span class="headline">エントリー</span><span class="subheadline">A チーム・3 人</span></span><span class="chevron">›</span></a></li>
              <li><a class="card" href="r7.html"><span class="card-main"><span class="headline">走順</span><span class="subheadline">確定</span></span><span class="chevron">›</span></a></li>
            </ul>
          </section>
          <section class="group">
            <h2 class="group-heading">走順と予想</h2>
            <div class="panel">
              <table class="times">
                <thead><tr><th>区</th><th>走者</th><th class="right">距離</th></tr></thead>
                <tbody>
                  <tr><td>1区</td><td>佐藤 健</td><td class="right">5 km</td></tr>
                  <tr><td>2区</td><td>鈴木 花子</td><td class="right">3.2 km</td></tr>
                  <tr><td>3区</td><td>高橋 翔</td><td class="right">3.2 km</td></tr>
                  <tr><td>4区</td><td>佐藤 健</td><td class="right">5 km</td></tr>
                </tbody>
              </table>
              <div class="card-row"><span class="card-main"><span class="subheadline">予想タイム</span></span><span class="title2 numbers">1:06:47</span></div>
            </div>
          </section>
          <section class="group">
            <h2 class="group-heading">走者のラップタイム</h2>
            <ul class="cards">
              <li class="card card-stack">
                <div class="card-row"><span class="card-main"><span class="headline">佐藤 健</span><span class="subheadline">1区・4区</span></span><span class="subheadline numbers">平均 3:58</span></div>
                <table class="times">
                  <thead><tr><th>km</th><th class="right">ラップ</th></tr></thead>
                  <tbody>
                    <tr><td>1</td><td class="right">3:55</td></tr>
                    <tr><td>2</td><td class="right">3:58</td></tr>
                    <tr><td>3</td><td class="right">4:01</td></tr>
                  </tbody>
                </table>
              </li>
              <li class="card"><span class="card-main"><span class="headline">鈴木 花子</span><span class="subheadline">2区・まだ入力されていません</span></span></li>
              <li class="card"><span class="card-main"><span class="headline">高橋 翔</span><span class="subheadline">3区・まだ入力されていません</span></span></li>
            </ul>
          </section>
        </main>
        <nav class="tabbar" aria-label="メイン">
          <a class="tab tab-current" href="r1.html"><span class="tab-icon"></span>大会</a>
          <a class="tab" href="m1.html"><span class="tab-icon"></span>名簿</a>
          <a class="tab" href="m3.html"><span class="tab-icon"></span>承認<span class="badge">2</span></a>
          <a class="tab" href="p1.html"><span class="tab-icon"></span>自分</a>
        </nav>
      </div>
      <div class="annotation">
        <ul>
          <li>幹事だけ：締め切り、大会の管理（R3〜R7 へ）、走順の下書き、走者のラップタイム（見るだけ）。</li>
          <li>走順が下書きのときは「走順確定」の代わりに <span class="label label-undecided">下書き</span> を出し、下書きの走順と予想を出す。</li>
          <li>幹事が誘われていれば、メンバーと同じ「あなたの出欠」を説明欄の下に出す。</li>
          <li>時間制の大会：説明欄は「制限時間」「1周の距離」「目標周回数」、予想は「予想周回数」。</li>
          <li>大会の削除や中止のボタンはない。</li>
        </ul>
      </div>
    </figure>

    <figure class="frame-wrap" id="member-invited">
      <figcaption>R2 メンバー：未回答・保留</figcaption>
      <div class="frame">
        <nav class="topbar"><a class="back" href="r1.html">‹ 大会</a></nav>
        <main class="content">
          <h1 class="title1">春のタイムトライアル</h1>
          <section class="panel">
            <dl class="facts">
              <dt>種別</dt><dd>距離制・4 区</dd>
              <dt>開催日</dt><dd>2027年3月7日（日）</dd>
              <dt>区の距離</dt><dd class="numbers">5 km・3.2 km・3.2 km・5 km</dd>
              <dt>目標タイム</dt><dd class="numbers">1:10:00</dd>
            </dl>
            <p class="body">7:00 に正門前に集合。</p>
          </section>
          <fieldset class="group" style="border: 0; margin: 0; padding: 0; min-width: 0">
            <legend class="group-heading" style="padding: 0; margin-bottom: 8px">あなたの出欠</legend>
            <div class="segments">
              <label class="segment"><input type="radio" name="attendance-invited" value="attending"><span class="segment-mark">○</span><span class="headline">参加</span></label>
              <label class="segment"><input type="radio" name="attendance-invited" value="undecided"><span class="segment-mark">△</span><span class="headline">保留</span></label>
              <label class="segment"><input type="radio" name="attendance-invited" value="not_attending"><span class="segment-mark">×</span><span class="headline">不参加</span></label>
            </div>
            <dl class="facts" style="grid-template-columns: 24px minmax(0, 1fr)">
              <dt>○</dt><dd class="subheadline">走ります。エントリーと走順の候補になります</dd>
              <dt>△</dt><dd class="subheadline">まだ決められません。あとで変えられます</dd>
              <dt>×</dt><dd class="subheadline">走りません。この大会は表示されなくなり、変えられません</dd>
            </dl>
          </fieldset>
        </main>
        <nav class="tabbar" aria-label="メイン">
          <a class="tab tab-current" href="r1.html"><span class="tab-icon"></span>大会</a>
          <a class="tab" href="p1.html"><span class="tab-icon"></span>自分</a>
        </nav>
      </div>
      <div class="annotation">
        <ul>
          <li>名前と説明欄だけ。締め切り、走順、予想、ラップタイムは出さない。</li>
          <li>この絵は未回答。保留のときは △ を青い枠で示す（<a href="#member-attending">参加</a>の ○ と同じ）。</li>
          <li>○ を押すと、すぐ回答が保存される。× は先に<a href="#confirm-not-attending">確認</a>する。</li>
        </ul>
      </div>
    </figure>

    <figure class="frame-wrap" id="member-attending">
      <figcaption>R2 メンバー：参加（走順確定）</figcaption>
      <div class="frame">
        <nav class="topbar"><a class="back" href="r1.html">‹ 大会</a></nav>
        <main class="content">
          <header class="group">
            <h1 class="title1">冬季ロードリレー</h1>
            <p><span class="label label-confirmed">走順確定</span></p>
          </header>
          <section class="panel">
            <dl class="facts">
              <dt>種別</dt><dd>距離制・4 区</dd>
              <dt>開催日</dt><dd>2026年12月20日（日）</dd>
              <dt>区の距離</dt><dd class="numbers">5 km・3.2 km・3.2 km・5 km</dd>
              <dt>目標タイム</dt><dd class="numbers">1:08:00</dd>
            </dl>
            <p class="body">7:00 に正門前に集合。ゼッケンは当日配ります。</p>
          </section>
          <section class="group">
            <h2 class="group-heading">走順と予想</h2>
            <div class="panel">
              <table class="times">
                <thead><tr><th>区</th><th>走者</th><th class="right">距離</th></tr></thead>
                <tbody>
                  <tr><td>1区</td><td>佐藤 健</td><td class="right">5 km</td></tr>
                  <tr><td>2区</td><td><strong>鈴木 花子（あなた）</strong></td><td class="right">3.2 km</td></tr>
                  <tr><td>3区</td><td><span class="label label-undecided">未定</span></td><td class="right">3.2 km</td></tr>
                  <tr><td>4区</td><td>佐藤 健</td><td class="right">5 km</td></tr>
                </tbody>
              </table>
              <div class="card-row"><span class="card-main"><span class="subheadline">予想タイム</span></span><span class="title2 numbers">52:55</span></div>
              <p class="note note-info">空きの区（3区）を除いた予想です。</p>
            </div>
            <a class="button button-primary button-block" href="l1.html">自分のラップタイム</a>
          </section>
          <fieldset class="group" style="border: 0; margin: 0; padding: 0; min-width: 0">
            <legend class="group-heading" style="padding: 0; margin-bottom: 8px">あなたの出欠</legend>
            <div class="segments">
              <label class="segment segment-selected"><input type="radio" name="attendance-attending" value="attending" checked><span class="segment-mark">○</span><span class="headline">参加</span></label>
              <label class="segment"><input type="radio" name="attendance-attending" value="undecided"><span class="segment-mark">△</span><span class="headline">保留</span></label>
              <label class="segment"><input type="radio" name="attendance-attending" value="not_attending"><span class="segment-mark">×</span><span class="headline">不参加</span></label>
            </div>
            <p class="note note-warning">「参加」から変えると、エントリーと走順から外れます。走順が確定していれば、この大会のラップタイムも消えます。</p>
          </fieldset>
        </main>
        <nav class="tabbar" aria-label="メイン">
          <a class="tab tab-current" href="r1.html"><span class="tab-icon"></span>大会</a>
          <a class="tab" href="p1.html"><span class="tab-icon"></span>自分</a>
        </nav>
      </div>
      <div class="annotation">
        <ul>
          <li>走順と予想は、確定した後だけ出す。確定前は説明欄と出欠だけ。</li>
          <li>「自分のラップタイム」は、確定した走順の走者のときだけ出す。</li>
          <li>誰も入っていない区は「未定」。予想はその区を除き、そのことを添える。</li>
          <li>「参加」から △ か × に変えるときは、先に<a href="#confirm-leave-attending">確認</a>する。</li>
        </ul>
      </div>
    </figure>

    <figure class="frame-wrap" id="confirm-not-attending">
      <figcaption>R2 確認：不参加にする</figcaption>
      <div class="frame">
        <div class="scrim">
          <div class="dialog" role="alertdialog" aria-labelledby="not-attending-title">
            <h2 class="headline" id="not-attending-title">不参加にしますか？</h2>
            <p class="body">この大会は表示されなくなり、回答は変えられません。</p>
            <div class="dialog-actions">
              <button class="button button-danger" type="button">不参加にする</button>
              <button class="button button-secondary" type="button">やめる</button>
            </div>
          </div>
        </div>
      </div>
      <div class="annotation"><p>「参加」から × にするときは、下の注意の文もこの確認に入れる。</p></div>
    </figure>

    <figure class="frame-wrap" id="confirm-leave-attending">
      <figcaption>R2 確認：「参加」から保留にする</figcaption>
      <div class="frame">
        <div class="scrim">
          <div class="dialog" role="alertdialog" aria-labelledby="leave-attending-title">
            <h2 class="headline" id="leave-attending-title">保留にしますか？</h2>
            <p class="body">エントリーに入っていれば、エントリーと走順から外れます。走順が確定していれば、この大会のラップタイムは消え、平均タイムは計算し直されます。</p>
            <div class="dialog-actions">
              <button class="button button-primary" type="button">保留にする</button>
              <button class="button button-secondary" type="button">やめる</button>
            </div>
          </div>
        </div>
      </div>
      <div class="annotation"><p>メンバーには自分がエントリーに入っているか見えないので、「入っていれば」と書く。</p></div>
    </figure>

  </div>
</div>
</body>
</html>
