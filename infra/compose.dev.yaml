# Development services, used together with compose.yaml:
#   docker compose -f infra/compose.yaml -f infra/compose.dev.yaml ...
# Normally started by the Dev Containers (app/backend/.devcontainer, app/frontend/.devcontainer).

services:
  backend-dev:
    build:
      context: ../app/backend
      dockerfile: ../../infra/docker/backend/Dockerfile
      target: dev
    # The whole repository is mounted so git works inside the container.
    volumes:
      - ..:/workspaces/tasuki:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspaces/tasuki/app/backend
    command: sleep infinity
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: tasuki
      DATABASE_URL: postgres://app:tasuki@postgres:5432/tasuki?sslmode=disable
      # Development only (ADR-0009): log in as any LINE user with POST /api/v1/dev/login.
      DEV_LOGIN_ENABLED: "true"
      # Logging in as this LINE user ID makes you an organizer (ADR-0006).
      ORGANIZER_LINE_USER_IDS: dev-organizer
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend-dev:
    build:
      context: ../app/frontend
      dockerfile: ../../infra/docker/frontend/Dockerfile
      target: dev
    # The whole repository is mounted so git works inside the container.
    # node_modules lives in a volume: it never touches the host and avoids slow bind-mount I/O.
    volumes:
      - ..:/workspaces/tasuki:cached
      - frontend-node-modules:/workspaces/tasuki/app/frontend/node_modules
      - pnpm-store:/pnpm/store
    working_dir: /workspaces/tasuki/app/frontend
    command: sleep infinity
    environment:
      # The Vite dev server proxies API requests here (app/frontend/vite.config.ts).
      BACKEND_URL: http://backend-dev:8080
    # Vite dev server (pnpm dev), reachable from the host browser.
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  go-mod-cache:
  go-build-cache:
  frontend-node-modules:
  pnpm-store:
