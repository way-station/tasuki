name: tasuki

services:
  mongo:
    image: mongo:8.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Same major version as Neon in production (ADR-0015, ADR-0018).
  # Local credentials only; production uses Neon's connection string.
  postgres:
    image: postgres:18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: tasuki
      POSTGRES_DB: tasuki
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "tasuki"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../app/backend
      dockerfile: ../../infra/docker/backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: tasuki
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  postgres-data:
