name: deploy

# Deploys main to Cloud Run (#29): build and push the image, apply migrations, then point the
# service at the new image (ADR-0018, ADR-0021). The setup it relies on is in
# docs/guides/production-setup.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Workload Identity Federation: GitHub issues an OIDC token that Google Cloud trusts (ADR-0021).
  id-token: write

# One deployment at a time, in the order of the pushes. A running one is never cancelled, so a
# migration is never cut off halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until production is set up: the repository variables exist only after
    # docs/guides/production-setup.md is done.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/tasuki:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Direct Workload Identity Federation, no service account key (ADR-0021). The provider
      # accepts only tokens from this repository's main branch.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Built here, not in Cloud Build: GitHub Actions is free for public repositories (ADR-0021).
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f infra/docker/backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # Before the deployment, over Neon's direct connection. If it fails, nothing is deployed.
      # Every migration must work with the image that is still running (ADR-0021).
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        # Keep the version in sync with infra/docker/backend/Dockerfile and backend.yml.
        run: |
          docker run --rm -e DATABASE_URL \
            -v "$PWD/app/backend/migrations:/migrations:ro" \
            --entrypoint sh migrate/migrate:v4.20.1 \
            -c 'migrate -path /migrations -database "$DATABASE_URL" up'

      # Changes only the image. The environment variables and secrets stay as they were set
      # by hand on the service (ADR-0021).
      - name: Deploy
        run: gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE" --quiet

      - name: Check /health
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/health"
