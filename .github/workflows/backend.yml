name: backend

on:
  pull_request:
    paths:
      - "app/backend/**"
      - "infra/docker/backend/**"
      - "infra/compose*.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - "infra/docker/backend/**"
      - "infra/compose*.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in sync with infra/docker/backend/Dockerfile (dev stage).
          version: v2.14.0
          working-directory: app/backend

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          # Keep in sync with infra/docker/backend/Dockerfile (dev stage).
          sqlc-version: "1.31.1"
      # Generated code is committed (ADR-0017); fail when it is older than its source.
      - name: Check that generated code is up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated code is out of date. Run make generate and commit the result."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        # mongo:8.0 refuses to start on Linux 6.19–7.0.13 (SERVER-121912), which the runner
        # images use since 2026-10-25. Keeping rseq on in glibc avoids the TCMalloc bug.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        # Keep in sync with infra/compose.yaml.
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: tasuki
          POSTGRES_DB: tasuki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d tasuki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
      DATABASE_URL: postgres://app:tasuki@localhost:5432/tasuki_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum
      - name: Install golang-migrate
        # Keep in sync with infra/docker/backend/Dockerfile (dev stage).
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - name: Apply migrations
        run: make db-migrate
      - name: Unit and integration tests
        # Stop at the first failing test; the remaining tests, in every package, do not run.
        run: make test-integration TESTFLAGS=-failfast

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build -f ../../infra/docker/backend/Dockerfile .
      - name: Build Dev Container image
        run: docker build --target dev -f ../../infra/docker/backend/Dockerfile .
